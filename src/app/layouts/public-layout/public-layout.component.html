<div class="relative min-h-screen">
    <!-- Navbar -->
    <div #menuWrapper>
        <app-navbar (menuToggled)="isMenuOpen = $event"></app-navbar>
    </div>

    <div 
        *ngIf="isMenuOpen" 
        class="fixed inset-0 bg-black bg-opacity-50 z-40 transition-opacity duration-300"
        (click)="isMenuOpen = false; navbar.collapseMenu()"
    ></div>

    <!-- Main Content -->
    <div>
        <router-outlet class="relative z-30"></router-outlet>
    </div>
</div>
