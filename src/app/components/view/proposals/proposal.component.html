<div class="min-h-screen bg-gradient-to-b from-[#d49b79] to-[#f5e6dc] flex items-center justify-center p-4 md:p-6">
    <div class="bg-white bg-opacity-90 backdrop-blur-lg p-4 md:p-6 lg:px-8 rounded-2xl shadow-2xl w-full max-w-5xl text-gray-800 font-serif mt-12">

        <h1 class="text-3xl md:text-4xl font-bold mb-3 text-center text-[#b66a53] font-display">Proposal Preview</h1>
    
        <ng-container *ngIf="proposal?.pdf_url; else loadingOrError">
            <iframe
                [src]="proposal.pdf_url | safeUrl"
                type="application/pdf"
                class="w-full h-[50vh] md:h-[55vh] rounded-lg border shadow-inner"
            ></iframe>
        </ng-container>
    
        <ng-template #loadingOrError>
            <p class="text-center text-gray-500 italic">No proposal available or loading failed.</p>
        </ng-template>
    
        <!-- Terms Agreement Section -->
        <div class="mt-8 space-y-5 font-body">
            <!-- Checkbox 1: Terms & Conditions -->
            <label class="flex items-start space-x-3">
                <input type="checkbox" [(ngModel)]="agreedToTerms" class="mt-1 accent-pink-600" />
                <span class="text-sm text-gray-700">
                    Please review and check the box if you agree to
                    <a
                        href="/terms-and-conditions"
                        target="_blank"
                        rel="noopener"
                        class="text-pink-600 underline hover:text-pink-800"
                    >
                        Rudbeckia's Terms & Conditions
                    </a>.
                </span>
            </label>
    
            <!-- Checkbox 2: Digital Signature -->
            <label class="flex items-start space-x-3 font-body">
                <input type="checkbox" [(ngModel)]="digitallySigned" class="mt-1 accent-pink-600" />
                <span class="text-sm text-gray-700">
                    Checking this box serves as a digital signature of agreement to the displayed proposal above.
                </span>
            </label>
    
            <div class="flex justify-center pt-4">
                <ng-container *ngIf="!isLoading; else redirectingSpinner">
                    <div class="flex space-x-6">
                        <button
                            class="px-6 py-2 rounded-md bg-[#3b8d5d] hover:bg-[#2d724a] text-white font-semibold transition duration-300 disabled:opacity-50"
                            [disabled]="!agreedToTerms || !digitallySigned"
                            (click)="acceptProposal()"
                        >
                            Accept Proposal
                        </button>
                
                        <button
                            class="px-6 py-2 rounded-md bg-[#b83e3e] hover:bg-[#932f2f] text-white font-semibold transition duration-300"
                            (click)="declineProposal()"
                        >
                            Decline Proposal
                        </button>
                    </div>
                </ng-container>
                
                <ng-template #redirectingSpinner>
                    <div class="flex flex-col items-center justify-center space-y-3">
                        <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-b-2 border-[#b66a53]"></div>
                        <p class="text-sm font-body text-gray-600">Parsing proposal... This may take a few moments</p>
                    </div>
                </ng-template>
            </div>
        </div>
    </div>
</div>
