<section 
    class="w-full flex min-h-[calc(100vh-76px)] items-center bg-no-repeat bg-cover bg-center bg-gray-700 bg-blend-multiply bg-opacity-40" 
    style="background-image: url('assets/images/landing/IMG_0695.jpg');"
>
    <div class="w-full flex flex-col items-center justify-center px-6 mx-auto">
        <div id="signInBox" class="w-full bg-white/70 rounded-lg shadow md:mt-0 sm:max-w-md xl:p-0 backdrop-blur-md">
            <div class="p-6 space-y-4 md:space-y-6 lg:space-y-8 sm:p-8">
                <h1 class="text-4xl font-display font-medium leading-tight tracking-tight text-center">
                    View Event Details
                </h1>
                
                <!--Reactive Form Setup-->
                <form 
                    [formGroup]="passcodeForm"
                    (ngSubmit)="onSubmit()"
                    class="w-full font-body max-w-md space-y-6 md:space-y-4 xl:max-w-xl"
                    style="margin-top: 10px;"
                >                    
                    <!--Passcode-->
                    <div>
                        <label for="Passcode" class="block mb-2 text-sm font-medium">Passcode</label>
                        <div class="relative">
                            <input 
                                [type]="showPasscode ? 'text' : 'Passcode'" 
                                formControlName="passcode" 
                                id="passcode" 
                                placeholder="Enter Passcode" 
                                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm placeholder-gray-400 rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5" 
                                required 
                            />
                            <button
                                type="button"
                                (click)="togglePasscodeVisibility()"
                                class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-500 focus:outline-none"
                            >
                                <svg 
                                    *ngIf="!showPasscode"    
                                    class="w-5 h-5 text-gray-800" 
                                    aria-hidden="true" 
                                    xmlns="http://www.w3.org/2000/svg" 
                                    fill="none" 
                                    viewBox="0 0 24 24">
                                    <path stroke="currentColor" stroke-width="2" d="M21 12c0 1.2-4.03 6-9 6s-9-4.8-9-6c0-1.2 4.03-6 9-6s9 4.8 9 6Z"/>
                                    <path stroke="currentColor" stroke-width="2" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
                                </svg>
                                <svg 
                                    *ngIf="showPasscode"
                                    class="w-5 h-5 text-gray-800" 
                                    aria-hidden="true" 
                                    xmlns="http://www.w3.org/2000/svg" 
                                    fill="none" 
                                    viewBox="0 0 24 24">
                                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.933 13.909A4.357 4.357 0 0 1 3 12c0-1 4-6 9-6m7.6 3.8A5.068 5.068 0 0 1 21 12c0 1-3 6-9 6-.314 0-.62-.014-.918-.04M5 19 19 5m-4 7a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
                                </svg>
                            </button>
                        </div>
                    </div>
    
                    <button 
                        type="submit" 
                        [disabled]="loading"
                        class="w-full inline-flex bg-white text-gray-600 text-sm font-semibold items-center justify-center py-2.5 px-5 focus:outline-none rounded-lg border-gray-200 hover:bg-gray-100 hover:text-gray-900 focus:z-10 focus:ring-4 focus:ring-gray-200"
                    >
                        <span *ngIf="!loading">Submit passcode</span>
                        <span *ngIf="loading" class="inline-block animate-spin border-4 rounded-full w-5 h-5"></span>
                    </button>
                </form>
            </div>
        </div>
    </div>
</section>
