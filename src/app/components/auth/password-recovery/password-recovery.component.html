<div class="min-h-screen bg-gradient-to-b from-[#d49b79] to-[#f5e6dc] flex items-center justify-center p-6">
    <div class="bg-white bg-opacity-90 backdrop-blur-lg p-8 rounded-2xl shadow-2xl w-full max-w-md text-gray-800 font-serif transform -translate-y-6">
        <h1 class="text-4xl font-bold mb-2 text-center text-[#b66a53] font-display">Reset Password</h1>
        <p class="text-center text-sm text-gray-600 mb-6">
            Enter the email associated with your account and we’ll send you a link to reset your password.
        </p>
    
        <form [formGroup]="recoveryForm" (ngSubmit)="onSubmit()">
            <div class="mb-4">
                <input
                    formControlName="email"
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#b66a53]"
                />
                <div *ngIf="recoveryForm.get('email')?.invalid && recoveryForm.get('email')?.touched" class="text-red-500 text-sm mt-1">
                    Please enter a valid email.
                </div>
            </div>
    
            <button
                type="submit"
                [disabled]="recoveryForm.invalid || loading"
                class="cursor-pointer w-full bg-[#b66a53] hover:bg-[#9a5845] text-white font-medium py-2 rounded-md transition duration-300"
            >
                {{ loading ? 'Sending...' : 'Send Reset Link' }}
            </button>
        </form>    
        <div class="text-center mt-6">
            <a [routerLink]="['/auth/login']" class="text-sm text-[#b66a53] underline hover:text-[#9a5845]">Back to login</a>
        </div>
    </div>
</div>
