<section 
    class="bg-no-repeat bg-cover bg-center bg-gray-700 bg-blend-multiply bg-opacity-40" 
    style="background-image: url('assets/images/landing/IMG_0695.jpg');"
>
    <div class="w-full flex flex-col items-center justify-center px-6 mx-auto min-h-[calc(100vh-4.8rem)]">
        <div id="signInBox" class="w-full bg-white/70 rounded-lg shadow md:mt-0 sm:max-w-md xl:p-0 backdrop-blur-md">
            <div class="p-6 space-y-4 md:space-y-6 lg:space-y-8 sm:p-8">
                <h1 class="text-4xl font-display font-medium leading-tight tracking-tight text-center">
                    Welcome Back
                </h1>
                
                <!--Reactive Form Setup-->
                <form 
                    [formGroup]="loginForm"
                    (ngSubmit)="onSubmit()"
                    class="w-full font-body max-w-md space-y-6 md:space-y-6 xl:max-w-xl"
                    style="margin-top: 10px;"
                >

                    <!--Login Error-->
                    <div *ngIf="loginError" class="text-red-500 text-sm font-medium">
                        {{ loginError }}
                    </div>
                    
                    <!--Email-->
                    <div>
                        <label for="email" class="block mb-2 text-sm font-medium">Email</label>
                        <input 
                            type="email" 
                            formControlName="email" 
                            id="email"
                            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5" 
                            placeholder="Enter your email" required>
                    </div>

                    <!--Password-->
                    <div>
                        <label for="password" class="block mb-2 text-sm font-medium">Password</label>
                        <div class="relative">
                            <input 
                                [type]="showPassword ? 'text' : 'password'" 
                                formControlName="password" 
                                id="password" 
                                placeholder="Enter Password" 
                                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5" 
                                required 
                            />
                            <button
                                type="button"
                                (click)="togglePasswordVisibility()"
                                class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-500 focus:outline-none"
                            >
                                <svg 
                                    *ngIf="!showPassword"    
                                    class="w-5 h-5 text-gray-800" 
                                    aria-hidden="true" 
                                    xmlns="http://www.w3.org/2000/svg" 
                                    fill="none" 
                                    viewBox="0 0 24 24">
                                    <path stroke="currentColor" stroke-width="2" d="M21 12c0 1.2-4.03 6-9 6s-9-4.8-9-6c0-1.2 4.03-6 9-6s9 4.8 9 6Z"/>
                                    <path stroke="currentColor" stroke-width="2" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
                                </svg>
                                <svg 
                                    *ngIf="showPassword"
                                    class="w-5 h-5 text-gray-800" 
                                    aria-hidden="true" 
                                    xmlns="http://www.w3.org/2000/svg" 
                                    fill="none" 
                                    viewBox="0 0 24 24">
                                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.933 13.909A4.357 4.357 0 0 1 3 12c0-1 4-6 9-6m7.6 3.8A5.068 5.068 0 0 1 21 12c0 1-3 6-9 6-.314 0-.62-.014-.918-.04M5 19 19 5m-4 7a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="flex items-center justify-between">
                        <div class="flex items-start">
                            <div class="flex items-center h-5">
                                <input 
                                    formControlName="remember" 
                                    id="remember" aria-describedby="remember" type="checkbox" 
                                    class="w-4 h-4 border border-gray-300 rounded bg-gray-50 focus:ring-3 focus:ring-primary-300" 
                                    required
                                />
                            </div>
                            <div class="ml-3 text-sm">
                                <label for="remember">Remember me</label>
                            </div>
                        </div>
                        <a routerLink="/password-recovery" class="text-sm font-medium hover:underline">Forgot password?</a>
                    </div>
    
                    <button 
                        type="submit" 
                        [disabled]="loading"
                        class="w-full inline-flex bg-white text-black text-sm font-medium items-center justify-center py-2.5 px-5 focus:outline-none rounded-lg border-gray-200 hover:bg-gray-100 hover:text-gray-900 focus:z-10 focus:ring-4 focus:ring-gray-200"
                    >
                        <span *ngIf="!loading">Sign into your account</span>
                        <span *ngIf="loading" class="inline-block animate-spin border-4 rounded-full w-5 h-5"></span>
                    </button>

                    <div class="items-center space-x-0 space-y-3 sm:flex sm:space-x-4 sm:space-y-0">
                        <button (click)="signInWithGoogle()" class="w-full inline-flex items-center justify-center py-2.5 px-5 text-sm font-medium text-gray-900 focus:outline-none bg-white rounded-lg border border-gray-200 hover:bg-gray-100 hover:text-gray-900 focus:z-10 focus:ring-4 focus:ring-gray-200">
                            <svg class="w-5 h-5 mr-2" viewBox="0 0 21 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <g clip-path="url(#clip0_13183_10121)"><path d="M20.3081 10.2303C20.3081 9.55056 20.253 8.86711 20.1354 8.19836H10.7031V12.0492H16.1046C15.8804 13.2911 15.1602 14.3898 14.1057 15.0879V17.5866H17.3282C19.2205 15.8449 20.3081 13.2728 20.3081 10.2303Z" fill="#3F83F8"/><path d="M10.7019 20.0006C13.3989 20.0006 15.6734 19.1151 17.3306 17.5865L14.1081 15.0879C13.2115 15.6979 12.0541 16.0433 10.7056 16.0433C8.09669 16.0433 5.88468 14.2832 5.091 11.9169H1.76562V14.4927C3.46322 17.8695 6.92087 20.0006 10.7019 20.0006V20.0006Z" fill="#34A853"/><path d="M5.08857 11.9169C4.66969 10.6749 4.66969 9.33008 5.08857 8.08811V5.51233H1.76688C0.348541 8.33798 0.348541 11.667 1.76688 14.4927L5.08857 11.9169V11.9169Z" fill="#FBBC04"/><path d="M10.7019 3.95805C12.1276 3.936 13.5055 4.47247 14.538 5.45722L17.393 2.60218C15.5852 0.904587 13.1858 -0.0287217 10.7019 0.000673888C6.92087 0.000673888 3.46322 2.13185 1.76562 5.51234L5.08732 8.08813C5.87733 5.71811 8.09302 3.95805 10.7019 3.95805V3.95805Z" fill="#EA4335"/></g><defs><clipPath id="clip0_13183_10121"><rect width="20" height="20" fill="white" transform="translate(0.5)"/></clipPath></defs>
                            </svg>                            
                            Sign in with Google
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
