<section
    style="background-image: url('assets/images/landing/IMG_0706.JPG');" 
    class="flex bg-no-repeat font-body bg-cover bg-center bg-gray-500 bg-blend-multiply w-full flex min-h-[calc(100vh-76px)]"
>
    <div class="w-1/2 pl-20 min-h-[calc(100vh-76px)] flex flex-col items-center justify-center">
        <img src="assets/images/landing/Logo_inverted.png" class="max-h-[500px] mx-auto rounded-t-full">
        <h2 class="mt-4 text-6xl font-display font-extrabold text-white">Flowers Made Simple</h2>
    </div>
    <div class="w-1/2 pr-20 pt-10">
        <div class="px-4 w-4/5 text-center mb-5 pt-2 mx-auto">
            <h2 class="mb-1 text-6xl font-display font-extrabold text-white">Contact Us</h2>
        </div>
        <form id="contactBox" [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="grid grid-cols-1 max-w-[850px] mx-auto gap-x-6 gap-y-3 p-8 rounded-lg shadow-sm sm:grid-cols-2 backdrop-blur-md">
            <div>
                <label for="first-name" class="block mb-1 text-md font-medium">First Name</label>
                <input formControlName="firstName" type="text" id="first-name" class="block p-2 w-full text-sm bg-gray-50 rounded-lg border border-gray-300 text-gray-400 shadow-sm focus:ring-primary-500 focus:border-primary-500" placeholder="Bonnie" required>
            </div>
            <div>
                <label for="last-name" class="block mb-1 text-md font-medium">Last Name</label>
                <input formControlName="lastName" type="text" id="last-name" class="block p-2 w-full text-sm bg-gray-50 rounded-lg border border-gray-300 text-gray-400 shadow-sm focus:ring-primary-500 focus:border-primary-500" placeholder="Green" required>
            </div>
            <div>
                <label for="email" class="block mb-1 text-md font-medium">Email</label>
                <input formControlName="email" type="email" id="email" class="block p-2 w-full text-sm bg-gray-50 rounded-lg border border-gray-300 shadow-sm text-gray-400 focus:ring-primary-500 focus:border-primary-500" placeholder="name@gmail.comcom" required>
            </div>
            <div>
                <label for="phone-number" class="block mb-1 text-md font-medium">Phone</label>
                <input formControlName="phone" type="number" id="phone-number" class="block p-2 w-full text-sm bg-gray-50 rounded-lg border border-gray-300 text-gray-400 shadow-sm focus:ring-primary-500 focus:border-primary-500" placeholder="+1 (XXX) XXX-XXXX" required>
            </div>
            <div>
                <label for="event-date" class="block mb-1 text-md font-medium">Event Date</label>
                <input formControlName="eventDate" type="date" id="event-date" class="block p-2 w-full text-sm bg-gray-50 rounded-lg border border-gray-300 shadow-sm text-gray-400 focus:ring-primary-500 focus:border-primary-500" required>
            </div>
            <div>
                <label for="venue" class="block mb-1 text-md font-medium">Venue</label>
                <input formControlName="venue" type="text" id="venue" class="block p-2 w-full text-sm bg-gray-50 rounded-lg border border-gray-300 shadow-sm text-gray-400 focus:ring-primary-500 focus:border-primary-500" placeholder="Harbor Lights" required>
            </div>
            <div>
                <label for="budget" class="block mb-1 text-md font-medium">Budget</label>
                <input formControlName="budget" type="text" id="event-date" class="block p-2 w-full text-sm bg-gray-50 rounded-lg border border-gray-300 shadow-sm text-gray-400 focus:ring-primary-500 focus:border-primary-500" placeholder="$1,999.00" required>
            </div>
            <div>
                <label for="coordinator" class="block mb-1 text-md font-medium">Day-of Coordinator</label>
                <input formControlName="coordinator" type="text" id="coordinator" class="block p-2 w-full text-sm bg-gray-50 rounded-lg border border-gray-300 shadow-sm text-gray-400 focus:ring-primary-500 focus:border-primary-500" placeholder="Susan Grimes" required>
            </div>
            <div class="sm:col-span-2">
                <label for="pinterest-link" class="block mb-1 text-md font-medium">Pinterest URL</label>
                <input formControlName="pinterest" type="text" id="pinterest" class="block p-2 w-full text-sm bg-gray-50 rounded-lg border border-gray-300 shadow-sm text-gray-400 focus:ring-primary-500 focus:border-primary-500" placeholder="http://pinterest.com/your-event-theme" required>
            </div>
            <div class="sm:col-span-2">
                <label for="message" class="block mb-1 text-md font-medium">What can I design for you?</label>
                <textarea formControlName="message"  id="message" rows="5" class="block text-gray-400 p-2 w-full text-sm bg-gray-50 rounded-lg shadow-sm border border-gray-300 focus:ring-primary-500 focus:border-primary-500" placeholder="Leave a comment..."></textarea>
                <p class="mt-4 text-xs">By submitting this form you agree to our <a href="#" class="hover:underline font-bold">terms and conditions</a> and our <a href="#" class="hover:underline">privacy policy</a> which explains how we may collect, use and disclose your personal information including to third parties.</p>
            </div>
            <div class="sm:col-span-2 flex justify-end">
                <button type="submit" class="py-2 px-5 mt-2 text-md font-bold text-center text-[rgb(195,145,110)] rounded-lg bg-white sm:w-fit hover:bg-[rgb(195,145,110)] hover:text-white hover:ring-2 hover:ring-white focus:ring-4 focus:ring-white transition duration-300">Send message</button>
            </div>
        </form>
    </div>
</section>
