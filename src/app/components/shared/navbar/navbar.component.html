<header class="fixed top-0 left-0 right-0 z-50 bg-white shadow-md">
    <nav class="px-4 xl:px-6 py-2">
        <div class="grid grid-cols-3 items-center mx-auto">
            <a routerLink="/" (click)="collapseMenu()" class="flex mt-2 items-center xl:justify-center xl:order-2">
                <span class="font-display text-3xl md:text-4xl whitespace-nowrap">Rudbeckia Florals</span>
            </a>
            <div class="flex col-span-2 font-nav text-lg justify-end items-center xl:order-3 xl:col-span-1">
                <a *ngIf="!hideLoginButton" routerLink="auth/login" (click)="toggleMenu()" class="hover:bg-white/20 text-sm md:text-xl font-medium rounded-xl px-4 py-2 xl:py-2.5 mr-2 focus:outline-none transition duration-300">Login</a>
                <button 
                    data-collapse-toggle="mobile-menu-2" type="button" 
                    class="inline-flex items-center p-2 ml-1 text-sm rounded-xl xl:hidden hover:bg-white/20 focus:outline-none focus:ring-2 focus:ring-gray-200" 
                    aria-controls="mobile-menu-2" 
                    aria-expanded="false"
                    (click)="toggleMenu()"
                >
                    <span class="sr-only">Open main menu</span>
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"></path></svg>
                    <svg class="hidden w-6 h-6" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg>
                </button>
            </div>
            <div 
                *ngIf="isMenuOpen"
                [@menuSlideFade]
                class="overflow-hidden w-full xl:hidden xl:w-auto xl:order-1 xl:col-span-1"
                id="mobile-menu-2"
            >
                <ul class="flex flex-col font-nav text-md md:text-lg font-medium xl:flex-row xl:space-x-2 xl:mt-0">
                    <li @menuItem>
                        <a routerLink="/about" (click)="collapseMenu()" class="block py-2 pr-4 pl-3 hover:bg-white/20 rounded-lg xl:p-2 transition duration-300">About</a>
                    </li>
                    <li @menuItem>
                        <a routerLink="/portfolio" (click)="collapseMenu()" class="block py-2 pr-4 pl-3 hover:bg-white/20 rounded-lg xl:p-2 transition duration-300">Portfolio</a>
                    </li>
                    <li @menuItem>
                        <a routerLink="/reviews" (click)="collapseMenu()" class="block py-2 pr-4 pl-3 hover:bg-white/20 rounded-lg xl:p-2 transition duration-300">Reviews</a>
                    </li>
                    <li @menuItem>
                        <a routerLink="/services" (click)="collapseMenu()" class="block py-2 pr-4 pl-3 hover:bg-white/20 rounded-lg xl:p-2 transition duration-300">Services</a>
                    </li>
                    <li @menuItem>
                        <a routerLink="/contact" (click)="collapseMenu()" class="block py-2 pr-4 pl-3 hover:bg-white/20 rounded-lg xl:p-2 transition duration-300">Contact</a>
                    </li>
                </ul>
            </div>

            <ul class="hidden xl:flex font-nav text-md md:text-lg font-medium space-x-4 xl:order-1 xl:col-span-1">
                <li>
                    <a routerLink="/about" class="px-2 py-2 hover:bg-white/20 rounded-lg transition duration-300">About</a>
                </li>
                <li>
                    <a routerLink="/portfolio" class="px-2 py-2 hover:bg-white/20 rounded-lg transition duration-300">Portfolio</a>
                </li>
                <li>
                    <a routerLink="/reviews" class="px-2 py-2 hover:bg-white/20 rounded-lg transition duration-300">Reviews</a>
                </li>
                <li>
                    <a routerLink="/services" class="px-2 py-2 hover:bg-white/20 rounded-lg transition duration-300">Services</a>
                </li>
                <li>
                    <a routerLink="/contact" class="px-2 py-2 hover:bg-white/20 rounded-lg transition duration-300">Contact</a>
                </li>
            </ul>
        </div>
    </nav>
</header>
