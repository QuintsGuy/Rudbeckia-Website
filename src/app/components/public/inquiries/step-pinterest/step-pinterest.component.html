<!-- Disclaimer -->
<div class="md:col-span-2 mb-3 px-4">
    <p class="text-sm text-white italic">
        You’re welcome to share Pinterest links or upload inspiration photos for your event.
    </p>
    <p class="text-sm text-white italic pt-2 px-4">
        **This is optional, but helps us understand your style.
    </p>
</div>

<!-- Pinterest Links -->
<div [formGroup]="formGroup" class="space-y-4 text-sm md:text-md text-gray-700 mb-6">
    <label class="block text-white font-medium text-base mb-1">Pinterest URLs</label>

    <div *ngFor="let url of formGroup.get('urls')?.value; let i = index" class="flex space-x-2 items-center">
        <button
            (click)="removePinterestUrl(i)"
            class="inline-flex items-center justify-center w-8 h-8 bg-red-100 text-red-600 rounded-md hover:bg-red-200 transition"
            aria-label="Remove URL"
        >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M20 12H4" />
            </svg>
        </button>
        <input
            type="url"
            class="w-full px-4 py-2 border border-gray-300 rounded-md placeholder-gray-400"
            placeholder="https://www.pinterest.com/..."
            [formControlName]="i"
        />
    </div>

    <button (click)="addPinterestUrl()" class="text-white hover:underline text-sm">+ Add another link</button>
</div>

<!-- Image Upload -->
<div class="space-y-2 text-sm md:text-md text-gray-700">
    <label class="block text-white font-medium text-base mb-1">Upload Inspiration Images</label>
    <label
        for="file-upload"
        class="inline-block cursor-pointer px-5 py-2 border-2 bg-blue-600 text-white rounded-md shadow-sm hover:bg-[#9a5845] transition"
    >
        Choose Files
    </label>
    <input
        id="file-upload"
        type="file"
        multiple
        class="hidden"
        (change)="handleFileInput($event)"
    />
    <div class="text-sm text-white italic" *ngIf="formGroup.get('images')?.value?.length">
        {{ formGroup.get('images')?.value.length }} file(s) selected
    </div>

    <!-- Image Preview Grid -->
    <div class="grid grid-cols-2 md:grid-cols-3 gap-4" *ngIf="formGroup.get('images')?.value.length > 0">
        <div *ngFor="let file of formGroup.get('images')?.value; let i = index" class="relative group">
            <img [src]="previewUrls[i]" class="w-full h-32 object-cover rounded-lg border-2" />
            <button
                (click)="removeImage(i)"
                class="absolute top-1 right-1 bg-red-600 text-white rounded-full w-6 h-6 text-xs flex items-center justify-center opacity-80 hover:opacity-100"
            >
                ✕
            </button>
        </div>
    </div>
</div>
